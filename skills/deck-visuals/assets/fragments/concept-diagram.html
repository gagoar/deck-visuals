<!--
  INJECTABLE FRAGMENT — paste into a rendered slide; do not use as a full page.

  An on-brand inline-SVG concept diagram. This example is the "flow" recipe from
  references/visual-concepts.md (three stages, connected left to right), in the
  house default shape vocabulary: a chamfered node (rectangle with 45°-cut
  corners) instead of a rounded rectangle, a small categorical-slot accent
  triangle filling the cut notch as the category tag, and a bolder chevron
  arrowhead. Swap labels and node count for the real slide; keep the
  marker/arrow reuse pattern and the brand-palette stroke colors (each node's
  stroke is a distinct slot from the fixed 8-slot categorical palette — that
  set never changes per theme).

  Three of these rules were learned the hard way — see
  references/visual-concepts.md's "Mistakes to never repeat" for the full
  writeup (it covers two more mistakes specific to isometric plates):
  - The accent tag is a TRIANGLE filling the exact notch the chamfer cut
    away (points at the node's own corner and the two chamfer-cut points) —
    never a plain axis-aligned rect at the corner, which overlaps the
    diagonal edge instead of sitting flush with it.
  - The arrow marker's `refX` equals the arrowhead path's own tip
    coordinate exactly (here 12, matching the "12,6" point in the path) —
    not an arbitrary value close to it. Any gap between refX and the true
    tip overhangs past the line's endpoint (scaled by the marker's
    stroke-width unit multiplier) and gets hidden under whatever draws next.
  - The marker's `markerWidth`/`markerHeight` (4, here) is chosen against the
    actual gap between nodes (24 units, at 3px stroke-width scaling = a
    12-unit rendered marker, half the gap) — not against how bold it looks
    in isolation. A too-large marker swallows the whole gap and the
    connector line with it, leaving only an oversized arrowhead visible.

  Node fill, edges, and caption use --dv-panel/--dv-text-secondary/--dv-text-dim
  custom properties (house navy as fallback) so the chosen theme's coordinated
  surface (references/brand.md, assets/palette-presets.md) applies once the host
  page sets them — never hardcode navy as if it were universal.
-->

    <!-- edges (drawn first, sit under the nodes) -->
