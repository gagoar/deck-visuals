  An on-brand inline-SVG concept diagram. This is the "architecture (layered
  boxes)" recipe from references/visual-concepts.md, in the house default
  ISOMETRIC construction: each band is an elevation tier of flat "plates" —
  a top diamond PLUS two extruded rim faces beneath it (the rim is what
  actually sells the depth; a bare diamond outline just reads as a rotated
  2D shape, not as dimensional — see visual-concepts.md's "Mistakes to never
  repeat", #2). The rim uses the plate's own categorical hex at reduced
  fill-opacity, never a derived/shaded tint, so no unvalidated hex is ever
  needed. Plates are stacked with a consistent per-tier offset to suggest a
  rising stack, tied together with a faint dashed guideline per tier. Struts
  connect adjacent tiers only, departing from the UPPER tier's rim-bottom tip
  (not its center — see "Mistakes to never repeat" #3, or the strut visibly
  bleeds through that tier's own translucent rim). Swap labels/counts for the
  real slide; keep the plate/tag construction and the brand-palette stroke
  colors (each plate's stroke is a distinct slot from the fixed 8-slot
  categorical palette — that set never changes per theme).

  Plate fill, struts, guides, tags, and caption use --dv-panel/--dv-text/
  --dv-text-secondary/--dv-text-dim/--dv-border-strong custom properties
  (house navy as fallback) so the chosen theme's coordinated surface
  (references/brand.md, assets/palette-presets.md) applies once the host page
  sets them — never hardcode navy as if it were universal.

  Text always stays flat/unrotated in its own small tag below each plate —
  never skewed with the plate — so the isometric treatment is exactly as
  legible as a flat diagram (see visual-concepts.md's "Text stays flat" rule).
-->
