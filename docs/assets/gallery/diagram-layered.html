<!DOCTYPE html>
<!--
  Marketing-site specimen — NEW, built for the gallery. The "Architecture
  (layered boxes)" recipe from references/visual-concepts.md: horizontal bands,
  edges only between adjacent bands. Same triage-automation system as the other
  two diagram specimens, drawn in a third idiom (coherence rule).

  Surface: Wes Anderson theme (assets/palette-presets.md) — a warm pastel
  accent sitting on a warm-hued near-black instead of navy, the direct proof
  that a warm theme no longer clashes with a cold blue floor. Node colors are
  the shared 8-slot categorical palette, unchanged (assets/brand-palette.md).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>deck-visuals — layered architecture diagram specimen</title>
<style>
  html, body { margin: 0; background: #240b12; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
</style>
</head>
<body>

<figure class="dv-diagram" aria-label="Layered architecture diagram: client band with the slide deck, service band with intake API and classifier, data band with the triage queue and case store. Edges only between adjacent bands.">
  <svg viewBox="0 0 560 250" role="img">
    <!-- band dividers -->
    <g stroke="#c599a2" stroke-opacity="0.18" stroke-width="1">
      <line x1="10" y1="90" x2="550" y2="90"></line>
      <line x1="10" y1="170" x2="550" y2="170"></line>
    </g>
    <!-- band labels -->
    <g font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1" fill="#855b64">
      <text x="16" y="49">CLIENT</text>
      <text x="16" y="129">SERVICE</text>
      <text x="16" y="209">DATA</text>
    </g>

    <!-- edges — adjacent bands only, drawn first -->
    <g stroke="#c599a2" stroke-width="2">
      <line x1="280" y1="70" x2="160" y2="100"></line>
      <line x1="160" y1="150" x2="160" y2="180"></line>
      <line x1="400" y1="150" x2="400" y2="180"></line>
    </g>

    <!-- Client band -->
    <g font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">
      <rect x="220" y="20" width="120" height="50" rx="10" fill="#33111b" stroke="#2894eb" stroke-width="2"></rect>
      <text x="280" y="50" fill="#eef3fb">Slide deck</text>
    </g>

    <!-- Service band -->
    <g font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">
      <rect x="100" y="100" width="120" height="50" rx="10" fill="#33111b" stroke="#d95926" stroke-width="2"></rect>
      <text x="160" y="130" fill="#eef3fb">Intake API</text>

      <rect x="340" y="100" width="120" height="50" rx="10" fill="#33111b" stroke="#199e70" stroke-width="2"></rect>
      <text x="400" y="130" fill="#eef3fb">Classifier</text>
    </g>

    <!-- Data band -->
    <g font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">
      <rect x="100" y="180" width="120" height="50" rx="10" fill="#33111b" stroke="#c98500" stroke-width="2"></rect>
      <text x="160" y="210" fill="#eef3fb">Triage queue</text>

      <rect x="340" y="180" width="120" height="50" rx="10" fill="#33111b" stroke="#d55181" stroke-width="2"></rect>
      <text x="400" y="210" fill="#eef3fb">Case store</text>
    </g>
  </svg>
  <figcaption class="dv-diagram__caption">The "Architecture" recipe — bands, edges only between neighbors.</figcaption>
</figure>

<style>
  .dv-diagram { margin: 0; max-width: 560px; font-family: 'Inter', sans-serif; }
  .dv-diagram svg { width: 100%; height: auto; display: block; }
  .dv-diagram__caption { margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #855b64; text-align: center; }
</style>
</body>
</html>
