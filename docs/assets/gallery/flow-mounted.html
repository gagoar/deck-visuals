<!DOCTYPE html>
<!--
  Marketing-site specimen wrapper — mounts assets/fragments/concept-diagram.html's
  real content (copied verbatim, the "Flow" recipe, REBUILT in the new house
  default chamfered-node construction — see that fragment's header for the
  full rationale) inside a standalone document for safe <iframe> mounting.
  See chart-mounted.html for why the wrapper exists.

  Surface: House theme (assets/palette-presets.md) — surface/panel/text hue-
  rotated to the accent's OKLCH hue at the SAME lightness/chroma as the
  original navy tokens (see references/brand.md), so contrast holds by
  construction. The node stroke/accent-tag colors below are the shared 8-slot
  categorical data palette (assets/brand-palette.md) — that set is fixed
  across every theme, by design; only the surface/panel/text and the accent
  vary.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>deck-visuals — flow diagram specimen</title>
<style>
  html, body { margin: 0; background: #041627; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
</style>
</head>
<body>

<figure class="dv-diagram" aria-label="Flow diagram: request, validate, commit.">
  <svg viewBox="0 0 560 160" role="img">
    <defs>
      <marker id="dv-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
        <path d="M0 0L12 6L0 12L4 6Z" fill="#8daac7"></path>
      </marker>
    </defs>

    <g stroke="#8daac7" stroke-width="3" marker-end="url(#dv-arrow)">
      <line x1="158" y1="80" x2="212" y2="80"></line>
      <line x1="348" y1="80" x2="402" y2="80"></line>
    </g>

    <g font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle">
      <polygon points="34,40 146,40 160,54 160,106 146,120 34,120 20,106 20,54"
        fill="#051f37" stroke="#2894eb" stroke-width="3"></polygon>
      <polygon points="20,40 42,40 20,62" fill="#2894eb"></polygon>
      <text x="90" y="85" fill="#eef3fb">Request</text>

      <polygon points="224,40 336,40 350,54 350,106 336,120 224,120 210,106 210,54"
        fill="#051f37" stroke="#d95926" stroke-width="3"></polygon>
      <polygon points="210,40 232,40 210,62" fill="#d95926"></polygon>
      <text x="280" y="85" fill="#eef3fb">Validate</text>

      <polygon points="414,40 526,40 540,54 540,106 526,120 414,120 400,106 400,54"
        fill="#051f37" stroke="#199e70" stroke-width="3"></polygon>
      <polygon points="400,40 422,40 400,62" fill="#199e70"></polygon>
      <text x="470" y="85" fill="#eef3fb">Commit</text>
    </g>
  </svg>
  <figcaption class="dv-diagram__caption">The "Flow" recipe — a linear process, A → B → C. Chamfered nodes, not rounded rects.</figcaption>
</figure>

<style>
  .dv-diagram {
    margin: 0;
    max-width: 560px;
    font-family: 'Inter', sans-serif;
  }
  .dv-diagram svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .dv-diagram__caption {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #4e6c88;
    text-align: center;
  }
</style>
</body>
</html>
